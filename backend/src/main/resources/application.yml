# DAY 1 — Spring Boot Foundation
# File: application.yml
# Purpose: Main Spring Boot configuration using environment variables

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tool101}
    username: ${POSTGRES_USER:tooluser}
    password: ${POSTGRES_PASSWORD:toolpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@example.com}
    password: ${MAIL_PASSWORD:your_email_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    org.springframework: INFO

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
